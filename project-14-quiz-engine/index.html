<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Quiz Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-container" id="quiz">
    <div class="quiz-header">
      <span id="progress">Question 1/4</span>
      <span id="timer">Time: 15s</span>
    </div>
    <h3 id="question">Question text goes here</h3>
    <div class="options" id="options"></div>
    <button id="nextBtn" class="btn" style="display:none;">Next Question</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
